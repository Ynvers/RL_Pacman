[project]
name = "rl-pacman"
version = "0.2.0"
description = "Pacman as a reinforcement learning environment, with a tabular Q-learning agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1",
    "torch>=2.14.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
rl-pacman = "rl_pacman.cli:main"

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_pacman"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pygame", "pygame.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
